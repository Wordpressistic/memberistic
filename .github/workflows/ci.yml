name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP syntax lint (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: php -l every file
        run: find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

  phpunit:
    name: PHPUnit unit suite (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # The unit suite is the only thing that runs on every supported PHP
      # without a database behind it, so it is the cheapest place to catch a
      # syntax-legal-but-runtime-broken 8.4 change. `php -l` above proves the
      # file parses; only executing it proves the behaviour survives.
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer

      # Keyed on the PHP version as well as the lockfile: Composer resolves
      # against the running platform, so a vendor/ built on 8.2 is not
      # necessarily the tree 8.4 would have installed. Sharing one key across
      # the matrix would let the first job to finish decide what the other two
      # actually test.
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php-version }}-composer-

      # Composer is the primary install path; the phar is a fallback so a
      # Packagist outage can't hide a real test regression behind a red
      # infrastructure step.
      - name: Install PHPUnit (composer, phar fallback)
        run: |
          if composer install --prefer-dist --no-progress --no-interaction; then
            echo "PHPUNIT=vendor/bin/phpunit" >> "$GITHUB_ENV"
          else
            mkdir -p tests/bin
            curl -sSLo tests/bin/phpunit-10.phar https://phar.phpunit.de/phpunit-10.phar
            echo "PHPUNIT=php tests/bin/phpunit-10.phar" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        run: $PHPUNIT -c phpunit.xml

  # P0-4. Plugin Check is the gate on the WordPress.org listing, so it runs
  # against the distributable tree rather than the repository: a reviewer only
  # ever sees what .distignore leaves behind. Checking the repository instead
  # would bury the findings that matter under findings about tests/, bin/ and
  # docs/strategy/, none of which ship.
  #
  # Building that tree from .distignore rather than restating the exclusions
  # as action inputs keeps one source of truth. A second list here would drift
  # the first time someone adds a dev-only file to the repository root.
  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLUGIN_SLUG: memberistic-membership-solutions
    steps:
      - uses: actions/checkout@v4

      # Same copy-then-remove construction as the release workflow, and
      # deliberately not rsync: the step then depends only on coreutils and the
      # exclusion list stays readable in the log. Keeping the two in step
      # matters more than brevity — the whole point is that Plugin Check sees
      # the same tree the release job zips.
      - name: Assemble the distributable tree
        run: |
          set -euo pipefail
          mkdir -p build/${PLUGIN_SLUG}
          tar --exclude=./build --exclude=./.git -cf - . | tar -xf - -C build/${PLUGIN_SLUG}
          while IFS= read -r pattern; do
            case "$pattern" in ''|'#'*) continue ;; esac
            echo "excluding: $pattern"
            rm -rf build/${PLUGIN_SLUG}/${pattern}
          done < .distignore
          echo "--- shipping tree (top level) ---"
          find build/${PLUGIN_SLUG} -maxdepth 1 -mindepth 1 | sort

      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: ./build/memberistic-membership-solutions
          # The slug is the install directory users actually get, which is what
          # the release job zips. Not overridden to match the shorter
          # "memberistic" text domain: if those two disagree, that is a real
          # finding for P0-4 to resolve, not something to hide from the check
          # that exists to find it.
          slug: memberistic-membership-solutions
          # No `categories` filter and no pinned `wp-version`: P0-4 asks for
          # the full default check set on current WordPress, which is what the
          # .org reviewer runs. Narrowing either would hide exactly the
          # plugin_repo findings that block the listing.
          #
          # The ignored codes below are the sniffs this plugin's architecture
          # answers deliberately rather than accidentally. Every one of them is
          # already suppressed inline, case by case, with a targeted
          # `phpcs:ignore` and a reason — 24 InterpolatedNotPrepared, 20
          # NotPrepared and 6 DirectDatabaseQuery annotations at the time of
          # writing. Memberistic stores its data in its own {prefix}memberistic_*
          # tables and queries them with raw $wpdb and prepare(); a membership is
          # not a post. There is no WP_Query path to migrate these to, and the
          # interpolated values are table names from a repository's table()
          # method, never from input.
          #
          # This list is a statement about architecture, not a way to quiet a
          # report. Anything not named here still blocks: nothing sets
          # ignore-warnings or ignore-errors, so a new finding of any other kind
          # fails the job.
          ignore-codes: |
            WordPress.DB.DirectDatabaseQuery.DirectQuery
            WordPress.DB.DirectDatabaseQuery.NoCaching
            WordPress.DB.DirectDatabaseQuery.SchemaChange
            WordPress.DB.PreparedSQL.InterpolatedNotPrepared
            WordPress.DB.PreparedSQL.NotPrepared

      # The action uploads its report as an artifact, which means reading it
      # costs a download and a click. Printing it puts the finding codes in the
      # log, where they are greppable and where whoever is triaging the next
      # failure can see them without leaving the page.
      - name: Print the Plugin Check report
        if: always()
        run: |
          report="${RUNNER_TEMP}/plugin-check-results.txt"
          if [ -s "$report" ]; then
            echo "--- Plugin Check findings ---"
            cat "$report"
          else
            echo "No Plugin Check report was produced (the run failed before checks ran)."
          fi

  js-lint:
    name: JS syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: node --check every asset script
        run: |
          set -e
          found=0
          while IFS= read -r -d '' f; do
            found=1
            echo "checking $f"
            node --check "$f"
          done < <(find assets -name '*.js' -not -path '*/node_modules/*' -print0)
          if [ "$found" -eq 0 ]; then
            echo "no JS files found under assets/ — nothing to check"
          fi

  phpcs:
    name: PHPCS PSR-12 (new services only, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Legacy plugin code predates the standard — style findings on the NEW
    # entitlement service are advisory and must not block merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install PHP_CodeSniffer
        run: composer require --dev squizlabs/php_codesniffer --no-interaction --no-progress

      - name: phpcs PSR-12 on the new entitlement service
        run: |
          set +e
          vendor/bin/phpcs --standard=PSR12 --report=full includes/integrations/class-entitlement-service.php
          code=$?
          set -e
          # Advisory only: the plugin's existing style (tabs) predates PSR-12
          # and is out of scope here. Findings are printed above for anyone
          # who wants them; the job always exits 0 so this shows green
          # instead of a permanent, meaningless red X on every PR.
          if [ "$code" -ne 0 ]; then
            echo "::warning::PSR-12 findings above are advisory only (this plugin's existing style predates PSR-12) and never block merges."
          fi
          exit 0
