name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP syntax lint (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: php -l every file
        run: find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

  phpunit:
    name: PHPUnit unit suite (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # The unit suite is the only thing that runs on every supported PHP
      # without a database behind it, so it is the cheapest place to catch a
      # syntax-legal-but-runtime-broken 8.4 change. `php -l` above proves the
      # file parses; only executing it proves the behaviour survives.
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer

      # Keyed on the PHP version as well as the lockfile: Composer resolves
      # against the running platform, so a vendor/ built on 8.2 is not
      # necessarily the tree 8.4 would have installed. Sharing one key across
      # the matrix would let the first job to finish decide what the other two
      # actually test.
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php-version }}-composer-

      # Composer is the primary install path; the phar is a fallback so a
      # Packagist outage can't hide a real test regression behind a red
      # infrastructure step.
      - name: Install PHPUnit (composer, phar fallback)
        run: |
          if composer install --prefer-dist --no-progress --no-interaction; then
            echo "PHPUNIT=vendor/bin/phpunit" >> "$GITHUB_ENV"
          else
            mkdir -p tests/bin
            curl -sSLo tests/bin/phpunit-10.phar https://phar.phpunit.de/phpunit-10.phar
            echo "PHPUNIT=php tests/bin/phpunit-10.phar" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        run: $PHPUNIT -c phpunit.xml

  js-lint:
    name: JS syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: node --check every asset script
        run: |
          set -e
          found=0
          while IFS= read -r -d '' f; do
            found=1
            echo "checking $f"
            node --check "$f"
          done < <(find assets -name '*.js' -not -path '*/node_modules/*' -print0)
          if [ "$found" -eq 0 ]; then
            echo "no JS files found under assets/ — nothing to check"
          fi

  phpcs:
    name: PHPCS PSR-12 (new services only, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Legacy plugin code predates the standard — style findings on the NEW
    # entitlement service are advisory and must not block merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install PHP_CodeSniffer
        run: composer require --dev squizlabs/php_codesniffer --no-interaction --no-progress

      - name: phpcs PSR-12 on the new entitlement service
        run: |
          set +e
          vendor/bin/phpcs --standard=PSR12 --report=full includes/integrations/class-entitlement-service.php
          code=$?
          set -e
          # Advisory only: the plugin's existing style (tabs) predates PSR-12
          # and is out of scope here. Findings are printed above for anyone
          # who wants them; the job always exits 0 so this shows green
          # instead of a permanent, meaningless red X on every PR.
          if [ "$code" -ne 0 ]; then
            echo "::warning::PSR-12 findings above are advisory only (this plugin's existing style predates PSR-12) and never block merges."
          fi
          exit 0

  # The distributable is what customers actually install, and it is assembled
  # by pruning the repository — so the only way to know it is correct is to
  # build it and look inside. Running this on every pull request means a
  # dev-only file added to the root fails here, on the PR that added it,
  # rather than silently shipping in the next release.
  #
  # Same two scripts the release workflow runs, deliberately: this job is the
  # rehearsal, and a rehearsal against different code proves nothing.
  dist-guard:
    name: Distributable contains no dev or internal files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build the distributable tree and archive
        run: bin/build-dist.sh --zip ci

      - name: Assert the archive is clean
        run: bin/assert-dist-clean.sh --zip ci

  # P0-4. Blocking, because the point of this job is the WordPress.org listing
  # and a listing gate that shows green while the reviewer's own tool reports
  # errors is worse than no gate.
  #
  # It checks the *distributable tree*, not the repository, and builds it with
  # bin/build-dist.sh — the same script dist-guard and the release workflow
  # run. Checking a differently-assembled tree would prove nothing about what
  # a reviewer actually downloads, and would report on tests/, bin/ and
  # docs/strategy/, none of which ship.
  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the distributable tree
        run: bin/build-dist.sh

      - uses: WordPress/plugin-check-action@v1
        with:
          build-dir: ./build/memberistic
          # wordpress.org requires the install directory to equal the Text
          # Domain, and the release zip is built to that slug.
          slug: memberistic
          # No `categories` filter and no pinned `wp-version`: P0-4 asks for the
          # full default check set on current WordPress, which is what the .org
          # reviewer runs. Narrowing either hides the plugin_repo findings that
          # block the listing.
          #
          # Nothing sets ignore-warnings or ignore-errors. This list names
          # specific sniffs and is a statement about architecture, not a way to
          # quiet the report:
          #
          # UnescapedDBParameter and the WordPress.DB.* family — two sniff
          # families fire on the same code, so naming only one leaves the job
          # red on the other half. Memberistic stores its data in its own
          # {prefix}memberistic_* tables and queries them with raw $wpdb; a
          # membership is not a post, so there is no WP_Query path to move to.
          # The sniff fires on the interpolated *table name*, which comes from a
          # repository's table() method and never from input, while the values
          # go through prepare() as %d/%s. Already suppressed inline, case by
          # case, in ~50 places.
          #
          # ReplacementsWrongNumber — one hit, in
          # memberistic_user_has_membership(). It builds an IN() list of %s
          # placeholders dynamically and passes the values as one array, which
          # the sniff cannot count statically. Verified by hand.
          #
          # unexpected_markdown_file — THIRD-PARTY-LICENSES.md. Attribution that
          # belongs in the shipped package, not dev tooling to strip.
          ignore-codes: |
            PluginCheck.Security.DirectDB.UnescapedDBParameter
            WordPress.DB.DirectDatabaseQuery.DirectQuery
            WordPress.DB.DirectDatabaseQuery.NoCaching
            WordPress.DB.DirectDatabaseQuery.SchemaChange
            WordPress.DB.PreparedSQL.InterpolatedNotPrepared
            WordPress.DB.PreparedSQL.NotPrepared
            WordPress.DB.PreparedSQLPlaceholders.ReplacementsWrongNumber
            unexpected_markdown_file
