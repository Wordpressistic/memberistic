name: WordPress integration

# The compatibility matrix for P0-1. Runs the integration suite against a real
# WordPress and a real database, across every supported WordPress and PHP
# version, so "tested up to" becomes a statement about what was tested rather
# than about what shipped.
#
# The matrix is not written here. It is built from
# `.github/wordpress-targets.json` by the `resolve` job, which fails the run
# when a declared target is not published on wordpress.org. That job is a gate,
# not a report: an earlier version of this workflow printed "NOT PUBLISHED" and
# then ran the matrix anyway, which is how `7.0.3` — a release that does not
# exist — sat in this file describing coverage nobody had.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Resolve and validate the requested versions before spending nine jobs on
  # them, and hand the matrix down as an output so the list cannot drift from
  # the list that was checked.
  resolve:
    name: Resolve WordPress versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wordpress: ${{ steps.targets.outputs.wordpress }}
      php: ${{ steps.targets.outputs.php }}
      canary: ${{ steps.targets.outputs.canary }}
    steps:
      - uses: actions/checkout@v4

      # Non-zero here skips the integration jobs entirely, which is the point:
      # a matrix that names a version wordpress.org does not publish must not
      # be allowed to run and report anything at all.
      - name: Validate compatibility targets against wordpress.org
        id: targets
        run: |
          chmod +x bin/check-wp-targets.py
          bin/check-wp-targets.py --github-output

  integration:
    name: WP ${{ matrix.wordpress }} · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        wordpress: ${{ fromJSON(needs.resolve.outputs.wordpress) }}
        php: ${{ fromJSON(needs.resolve.outputs.php) }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip, gd
          coverage: none
          tools: composer

      # PHPUnit 9.6, not the 10.5 the unit suite pins. The WordPress core test
      # library still calls PHPUnit\Util\Test::parseTestMethodAnnotations(),
      # which PHPUnit 10 removed, so every test errors under 10.x — on every
      # supported line and on trunk alike. Installed over the top here so the
      # integration job's vendor/ is internally consistent; composer.lock and
      # the unit suite are untouched.
      # The polyfills constraint is pinned alongside PHPUnit rather than left
      # to resolve: composer.json allows ^1.1 || ^2.0, and the combination the
      # matrix was actually verified green on is 9.6 with polyfills 1.x. 2.x
      # declares support for PHPUnit 9, so it would very likely work too — but
      # "very likely" is not what a compatibility matrix is for.
      - name: Downgrade to PHPUnit 9.6 for the WordPress test library
        run: |
          composer require --dev --no-interaction --no-progress \
            --with-all-dependencies 'phpunit/phpunit:^9.6' 'yoast/phpunit-polyfills:^1.1'
          vendor/bin/phpunit --version

      - name: Install WordPress ${{ matrix.wordpress }} and the test library
        run: |
          chmod +x bin/install-wp-tests.sh
          bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wordpress }}

      - name: Run integration suite
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: |
          set -o pipefail
          vendor/bin/phpunit -c phpunit-integration.xml --testdox 2>&1 | tee /tmp/phpunit.log

      # The failing output otherwise sits in the middle of the log, above forty
      # lines of MySQL container chatter, where it is awkward to reach through
      # the API. Repeating it in a step of its own puts it at the end.
      - name: Suite output (on failure)
        if: failure()
        run: |
          echo '=========== INTEGRATION SUITE OUTPUT ==========='
          tail -120 /tmp/phpunit.log || echo 'No output captured — the run died before PHPUnit produced any.'
          echo '==============================================='

  # Forward-compatibility canary. Non-blocking by design: a failure here is
  # information about an unreleased WordPress, not a reason to stop shipping.
  # Never treat a green canary as support for the version it tested — support
  # is claimed by adding a published release to `blocking` in
  # .github/wordpress-targets.json and watching the matrix above pass.
  canary:
    name: Canary · WordPress ${{ needs.resolve.outputs.canary }} · PHP 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: resolve
    continue-on-error: true

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, zip, gd
          coverage: none
          tools: composer

      - name: Downgrade to PHPUnit 9.6 for the WordPress test library
        run: |
          composer require --dev --no-interaction --no-progress \
            --with-all-dependencies 'phpunit/phpunit:^9.6' 'yoast/phpunit-polyfills:^1.1'

      - name: Install WordPress ${{ needs.resolve.outputs.canary }}
        run: |
          chmod +x bin/install-wp-tests.sh
          bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ needs.resolve.outputs.canary }}

      - name: Run integration suite against the canary
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: |
          set -o pipefail
          vendor/bin/phpunit -c phpunit-integration.xml --testdox 2>&1 | tee /tmp/phpunit.log

      - name: Suite output (on failure)
        if: failure()
        run: |
          echo '=========== CANARY SUITE OUTPUT ==========='
          tail -120 /tmp/phpunit.log || echo 'No output captured.'
          echo '==========================================='

      - name: Note the canary result
        if: always()
        run: |
          echo 'The canary is advisory. Do not declare support for an' >> "$GITHUB_STEP_SUMMARY"
          echo 'unreleased WordPress version on the strength of this job —' >> "$GITHUB_STEP_SUMMARY"
          echo 'add the published release to .github/wordpress-targets.json' >> "$GITHUB_STEP_SUMMARY"
          echo 'and let the blocking matrix prove it.' >> "$GITHUB_STEP_SUMMARY"
