name: Feature request
description: Propose a capability Memberistic does not have
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Check `docs/strategy/09-execution-backlog.md` first — the work may
        already be scoped, and `docs/strategy/00-master-plan.md` explains what
        the product is deliberately *not* doing.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        Describe the membership-business situation that goes wrong today, not
        the solution. What does the site owner, the staff member or the member
        actually fail to do?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: How you handle it today
      description: Manual process, another plugin, custom code, or nothing.
    validations:
      required: true

  - type: dropdown
    id: business
    attributes:
      label: What kind of membership business is this for?
      options:
        - Gym / fitness studio
        - Club (shooting, sports, social)
        - Association / professional body
        - Range
        - Course / content / creator membership
        - Corporate / group memberships
        - Multi-location operator
        - Agency building for clients
        - Other
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: Where do you think this belongs?
      description: >
        Free core, paid Pro, or the hosted cloud layer. A guess is fine — see
        `docs/strategy/04-business-model.md` for how the lines are currently drawn.
      options:
        - Free core — a membership site is incomplete without it
        - Pro — growth/revenue tooling
        - Cloud — hosted portal, community or automation
        - No opinion
    validations:
      required: true

  - type: textarea
    id: scale
    attributes:
      label: Scale
      description: Roughly how many members, plans and staff users, if relevant.
